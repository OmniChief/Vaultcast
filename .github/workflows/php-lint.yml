name: PHP syntax check
on:
  push:
    branches: ['1.3.1']
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          find Application -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Acquisition hardening regression tests
        run: php Application/tests/AcquisitionHardeningTest.php
